name: modfoundry
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modfoundry
      POSTGRES_USER: modfoundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the application environment}
    volumes:
      - modfoundry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modfoundry -d modfoundry"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - modfoundry-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]

  migrate:
    build:
      context: https://github.com/kawika4783/ModFoundry.git#main
      dockerfile: infra/api.Dockerfile
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://modfoundry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the application environment}@postgres:5432/modfoundry?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    build:
      context: https://github.com/kawika4783/ModFoundry.git#main
      dockerfile: infra/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://modfoundry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the application environment}@postgres:5432/modfoundry?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    networks: [private]

  web:
    build:
      context: https://github.com/kawika4783/ModFoundry.git#main
      dockerfile: infra/web.Dockerfile
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "32121:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    networks: [private]

volumes:
  modfoundry-postgres: {}
  modfoundry-redis: {}

networks:
  private:
    internal: true
