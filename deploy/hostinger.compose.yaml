name: modfoundry
services:
  preview:
    image: node:22-alpine
    working_dir: /workspace/source
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache git
        corepack enable
        rm -rf /workspace/source
        git clone --depth 1 --branch main https://github.com/kawika4783/ModFoundry.git /workspace/source
        cd /workspace/source
        pnpm install --frozen-lockfile
        pnpm --filter @modfoundry/web build
        exec pnpm --filter @modfoundry/web start
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: http://127.0.0.1:4000
    ports:
      - "32121:3000"
    volumes:
      - modfoundry-pnpm-store:/root/.local/share/pnpm/store
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
    restart: unless-stopped

volumes:
  modfoundry-pnpm-store: {}
