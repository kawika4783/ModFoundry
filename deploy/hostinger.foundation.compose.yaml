name: modfoundry-foundation
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modfoundry
      POSTGRES_USER: modfoundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modfoundry -d modfoundry"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]
  migrate:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://modfoundry:${POSTGRES_PASSWORD}@postgres:5432/modfoundry?schema=public
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [private]
  seed:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    command: ["pnpm", "db:seed"]
    environment:
      DATABASE_URL: postgresql://modfoundry:${POSTGRES_PASSWORD}@postgres:5432/modfoundry?schema=public
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"
    networks: [private]
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_URL: ${APP_URL:?Set APP_URL}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      DATABASE_URL: postgresql://modfoundry:${POSTGRES_PASSWORD}@postgres:5432/modfoundry?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      seed: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [private]
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:32122:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    restart: unless-stopped
    networks: [private]
volumes:
  postgres-data: {}
  redis-data: {}
networks:
  private: {internal: true}
