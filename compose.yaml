name: modfoundry
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modfoundry}
      POSTGRES_USER: ${POSTGRES_USER:-modfoundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    networks: [private]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    networks: [private]
  migrate:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    command: ["pnpm", "db:migrate"]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
    networks: [private]
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: .env
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"], interval: 15s, timeout: 5s, retries: 10}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    networks: [private, proxy]
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    environment: {NODE_ENV: production, API_URL: http://api:4000, NEXT_PUBLIC_API_URL: /api/v1}
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"], interval: 15s, timeout: 5s, retries: 10}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    networks: [private, proxy]
volumes: {postgres-data: {}, redis-data: {}}
networks: {private: {internal: true}, proxy: {}}
